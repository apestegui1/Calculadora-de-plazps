<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Plazos - Misiones</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 font-sans">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- TARJETA PRINCIPAL: CALCULADORA -->
    <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-200 max-w-md mx-auto">
      
      <!-- ENCABEZADO CON TU LOGO LOCAL -->
      <div class="flex flex-col items-center mb-5">
        <img src="logo.png" alt="Logo Poder Judicial Misiones" class="h-16 w-auto object-contain mb-2">
        <h1 class="text-xl font-bold text-slate-800 mb-0.5 text-center">Calculadora de Plazos</h1>
        <p class="text-xs font-medium text-slate-500 text-center">Poder Judicial de Misiones</p>
      </div>

      <!-- Datos del Individuo/Causa -->
      <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Instructor / FPO / Car&aacute;tula </label>
      <input type="text" id="nombrePersona" placeholder="Ej: Perez Juan / FPO" class="w-full border border-slate-300 rounded-lg p-2.5 mb-4 text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      
      <!-- Campo: Fecha de Notificación -->
      <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Fecha de Notificaci&oacute;n</label>
      <input type="date" id="fechaNotificacion" class="w-full border border-slate-300 rounded-lg p-2.5 mb-4 text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none">

      <!-- Campo: Plazo (días) -->
      <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Plazo (d&iacute;as)</label>
      <input type="number" id="diasPlazo" value="5" min="1" class="w-full border border-slate-300 rounded-lg p-2.5 mb-4 text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none">

      <!-- Campo: Tipo de Plazo -->
      <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Tipo de C&oacute;mputo</label>
      <select id="tipoPlazo" class="w-full border border-slate-300 rounded-lg p-2.5 mb-5 text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <option value="habiles">D&iacute;as H&aacute;biles Judiciales</option>
        <option value="corridos">D&iacute;as Corridos</option>
      </select>

      <!-- Botones -->
      <div class="space-y-2">
        <button onclick="calcularVencimiento()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition shadow-md active:scale-95">
          Calcular Vencimiento
        </button>
        <button id="btnGuardar" onclick="guardarRegistro()" class="hidden w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-700 transition shadow-md text-sm">
          💾 Guardar en Lista de Vencimientos
        </button>
      </div>

      <!-- Panel de Resultados -->
      <div id="resultado" class="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200 hidden space-y-3">
        <p class="font-bold text-lg text-slate-900 border-b border-slate-200 pb-2" id="txtVencimiento"></p>
        <div class="text-xs text-slate-600 bg-white p-3 rounded-lg border border-slate-200 shadow-sm hidden" id="txtInhabiles"></div>
        
        <!-- Opciones de Agendado en Calendario -->
        <div class="pt-2 border-t border-slate-200 space-y-2">
          <p class="text-xs font-semibold text-slate-600">Agendar Vencimiento:</p>
          <div class="grid grid-cols-1 gap-2">
            <button onclick="agendarGoogleCalendar()" class="w-full bg-slate-800 text-white text-xs font-medium py-2 px-3 rounded-lg hover:bg-slate-900 transition flex items-center justify-center gap-1.5 shadow-sm">
              📅 Abrir en Google Calendar
            </button>
            <button onclick="descargarICS()" class="w-full bg-slate-200 text-slate-700 text-xs font-medium py-2 px-3 rounded-lg hover:bg-slate-300 transition flex items-center justify-center gap-1.5">
              📥 Descargar Evento (.ics / Outlook)
            </button>
          </div>
        </div>
      </div>

      <!-- Menú de Días Inhábiles -->
      <div class="mt-6 pt-4 border-t border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Calendario Inh&aacute;bil</span>
          <button onclick="toggleMenuInhabiles()" class="text-xs font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 px-2.5 py-1 rounded-md border border-blue-100">
            ⚙️ Gestionar D&iacute;as
          </button>
        </div>

        <div id="menuInhabiles" class="hidden space-y-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
          <div class="space-y-2">
            <input type="date" id="nuevaFechaInhabil" class="w-full border border-slate-300 rounded-md p-2 text-xs">
            <input type="text" id="nuevoMotivoInhabil" placeholder="Motivo (ej: Feria, Asueto STJ)" class="w-full border border-slate-300 rounded-md p-2 text-xs">
            <button onclick="agregarInhabil()" class="w-full bg-emerald-600 text-white text-xs font-semibold py-2 rounded-md hover:bg-emerald-700 transition">
              + Agregar D&iacute;a Inh&aacute;bil
            </button>
          </div>
          <p class="text-[10px] text-slate-400">S&aacute;bados y domingos no requieren cargarse manualmente.</p>
          <ul id="listaInhabiles" class="space-y-1.5 text-xs text-slate-700 max-h-48 overflow-y-auto pr-1"></ul>
        </div>
      </div>
    </div>

    <!-- TARJETA SECUNDARIA: TABLA Y FILTROS DE REGISTROS GUARDADOS -->
    <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-200">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800">Vencimientos Guardados</h2>
          <p class="text-xs text-slate-500">Filtra y gestiona las fechas cargadas por Instructor o FPO.</p>
        </div>
        
        <!-- Buscador de Persona/Carátula -->
        <input type="text" id="filtroNombre" oninput="renderizarGuardados()" placeholder="🔍 Buscar por nombre o FPO..." class="border border-slate-300 rounded-lg px-3 py-2 text-xs w-full md:w-64 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <!-- Tabla de Registros -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
              <th class="p-2.5 font-semibold">Instructor / FPO</th>
              <th class="p-2.5 font-semibold">Notificación</th>
              <th class="p-2.5 font-semibold">Plazo</th>
              <th class="p-2.5 font-semibold">Vencimiento</th>
              </tr>
          </thead>
          <tbody id="tablaGuardados" class="divide-y divide-slate-100 text-slate-700">
            <!-- Filas dinámicas generadas por JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
